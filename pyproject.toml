[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniid"
version = "0.1.0"
description = "OmniID: An Open Foundation Model for Identity Intelligence"
authors = [{ name = "OmniID Core Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision",
    "torchaudio",
    "transformers>=4.36.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "faiss-cpu",
    "pydantic>=2.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0"
]

[project.scripts]
omniid = "omniid.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "isort", "mypy"]
